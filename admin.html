    <div id="admin-login-gate" class="fixed inset-0 z-[200] flex items-center justify-center p-4 admin-shell">
        <div class="w-full max-w-md rounded-2xl border border-blue-100 bg-white/95 p-6 md:p-8 shadow-xl backdrop-blur-sm">
            <h1 class="text-2xl font-bold text-gray-800 mb-1">Вход в админку</h1>
            <p class="text-sm text-gray-500 mb-6">Введите секретный ключ доступа (хранится в <code class="text-xs bg-slate-100 px-1 rounded">admin-config.json</code> на сервере).</p>
            <form id="admin-login-form" class="space-y-4" autocomplete="on">
                <div class="sr-only">
                    <label for="admin-login-username">Имя пользователя</label>
                    <input type="text" id="admin-login-username" name="username" autocomplete="username" value="re-spo-admin" readonly tabindex="-1">
                </div>
                <div>
                    <label for="admin-key-input" class="block text-sm font-medium text-gray-700 mb-1">Ключ</label>
                    <input type="password" id="admin-key-input" name="admin-key" autocomplete="current-password" maxlength="400" class="w-full border border-slate-300 rounded-md px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Секретный ключ" required>
                </div>
                <p id="admin-login-error" class="text-sm text-red-600 hidden" role="alert"></p>
                <button type="submit" id="admin-login-submit" class="w-full bg-blue-600 text-white py-2.5 rounded-md font-medium text-sm hover:bg-blue-700">Войти</button>
            </form>
        </div>
