name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: "76ebca3744d5.vps.myjino.ru"
          username: "root"
          password: "Nikitoso02"
          port: 49268
          script: |
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive

            if [ -f /etc/apt/sources.list.d/nginx.list ]; then
              mv /etc/apt/sources.list.d/nginx.list /etc/apt/sources.list.d/nginx.list.disabled || true
            fi

            apt-get update -qq
            apt-get install -y git curl ca-certificates

            if ! command -v npm > /dev/null 2>&1; then
              apt-get remove -y nodejs nodejs-doc libnode109 2>/dev/null || true
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt-get install -y nodejs
            fi

            if ! command -v pm2 > /dev/null 2>&1; then
              npm install -g pm2
            fi

            mkdir -p /var/www
            cd /var/www

            if [ ! -d "re-spo/.git" ]; then
              rm -rf re-spo
              git clone https://github.com/GiornoGiovanaJoJo/re-spo.git
            fi

            cd re-spo

            # Данные админки (товары, сертификаты, тексты и т.д.) — не затирать при деплое
            PRESERVE_DIR=/var/www/re-spo-admin-preserve
            mkdir -p "$PRESERVE_DIR"
            for f in products.json certificates.json reviews.json home-content.json site-text.json; do
              if [ -f "$f" ]; then cp -a "$f" "$PRESERVE_DIR/$f"; fi
            done

            git fetch --all
            git reset --hard origin/main

            for f in products.json certificates.json reviews.json home-content.json site-text.json; do
              if [ -f "$PRESERVE_DIR/$f" ]; then cp -a "$PRESERVE_DIR/$f" "$f"; fi
            done

            mkdir -p assets logs
            npm install --omit=dev

            pm2 restart ecosystem.config.js --env production || pm2 start ecosystem.config.js --env production
            pm2 save

            printf '%s\n' \
              'server {' \
              '    listen 80;' \
              '    server_name _;' \
              '    client_max_body_size 100M;' \
              '' \
              '    location / {' \
              '        proxy_pass http://127.0.0.1:3000;' \
              '        proxy_http_version 1.1;' \
              '        proxy_set_header Upgrade $http_upgrade;' \
              '        proxy_set_header Connection '"'"'upgrade'"'"';' \
              '        proxy_set_header Host $host;' \
              '        proxy_set_header X-Real-IP $remote_addr;' \
              '        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;' \
              '        proxy_set_header X-Forwarded-Proto $scheme;' \
              '        proxy_cache_bypass $http_upgrade;' \
              '    }' \
              '}' > /etc/nginx/conf.d/default.conf

            if command -v systemctl > /dev/null 2>&1 && systemctl is-active --quiet nginx 2>/dev/null; then
              systemctl reload nginx || systemctl restart nginx
            elif command -v nginx > /dev/null 2>&1; then
              nginx -t && nginx -s reload
            fi

            echo "✅ Deployment complete!"
