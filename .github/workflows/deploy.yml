name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: "60f67cfaba8e.vps.myjino.ru"
          username: "root"
          password: "Nikitoso02"
          port: 49340
          script: |
            # Set up base directory
            mkdir -p /var/www
            cd /var/www

            # Install node and npm if not present
            if ! command -v node > /dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt-get install -y nodejs
            fi

            # Install PM2 globally if not present
            if ! command -v pm2 > /dev/null; then
              npm install -g pm2
            fi

            # Clone or update repository first
            if [ ! -d "re-spo/.git" ]; then
              rm -rf re-spo
              git clone https://github.com/GiornoGiovanaJoJo/re-spo.git
            fi

            cd re-spo

            # Данные админки (товары, сертификаты, тексты и т.д.) — не затирать при деплое
            PRESERVE_DIR=/var/www/re-spo-admin-preserve
            mkdir -p "$PRESERVE_DIR"
            for f in products.json certificates.json reviews.json home-content.json site-text.json; do
              if [ -f "$f" ]; then cp -a "$f" "$PRESERVE_DIR/$f"; fi
            done

            git fetch --all
            git reset --hard origin/main

            for f in products.json certificates.json reviews.json home-content.json site-text.json; do
              if [ -f "$PRESERVE_DIR/$f" ]; then cp -a "$PRESERVE_DIR/$f" "$f"; fi
            done

            # Ensure assets directory exists for uploads
            mkdir -p assets

            # Install production dependencies
            npm install --omit=dev

            # Restart application with PM2
            pm2 restart ecosystem.config.js --env production || pm2 start ecosystem.config.js --env production

            echo "✅ Deployment complete!"
